<title>Mon espace Aura</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700;800&family=Parisienne&display=swap">
<style>
/* Layout : un vrai téléphone. Écran verrouillé → accueil (widgets, tuiles pastel à emoji, dock) → applis plein écran avec barre d'onglets. */
:root{
  --paper:#fcf6f1; --blush:#f8e1e5; --gold-soft:#efe0bf; --card:#ffffff; --ink:#2b1418; --soft:#7d6268; --line:#f0dede;
  --red:#7a1530; --red-ink:#ffffff; --red-soft:#f7e4e7; --creme:#fbf4ec;
  --pink:#f6c7d5; --mint:#c4ddd0; --sky:#cbd9ef; --peach:#f5d1b6; --butter:#fbeec4; --lilac:#e7ddf7;
  --good:#2f8a55; --gold:#d6a33a;
  --f-serif:"Cormorant Garamond","Didot","Bodoni 72","Times New Roman",serif;
  --f-ui:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-hand:"Parisienne","Snell Roundhand",cursive;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:#14070b;color:var(--ink);font-family:var(--f-ui);margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.device{position:fixed;inset:0;overflow:hidden;background:#000}
@media (min-width:640px) and (min-height:720px){
  body{background:radial-gradient(circle at 50% 30%,#3a1420,#14070b)}
  .device{inset:auto;left:50%;top:50%;width:390px;height:min(844px,calc(100% - 48px));transform:translate(-50%,-50%);border-radius:54px;box-shadow:0 0 0 11px #0d0d0f,0 0 0 13px #3a3a3e,0 40px 80px rgba(0,0,0,.6)}
}
.wall{position:absolute;inset:0;background:var(--wallbg,linear-gradient(175deg,#f3c3cc 0%,#d27a8c 40%,#7e2236 78%,#2a0910 100%));background-size:cover;background-position:center}
.wall::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,0) 32%,rgba(0,0,0,0) 68%,rgba(0,0,0,.3))}
.screen{position:absolute;inset:0}
.on-wall{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.avatar{border-radius:50%;object-fit:cover;flex:none;display:block}

/* Écran verrouillé */
#lock{z-index:30;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 54px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px));transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s;touch-action:none;user-select:none;-webkit-user-select:none}
#lock .wall{z-index:-1}
#lock.gone{transform:translateY(-100%);opacity:0;pointer-events:none}
.ldate{font-size:20px;font-weight:600}
.lclock{font-size:94px;font-weight:700;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:2px;font-family:-apple-system,"SF Pro Display",var(--f-ui)}
.notifs{width:100%;max-width:370px;display:flex;flex-direction:column;gap:9px;margin-top:26px}
.notif{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border-radius:22px;background:rgba(245,230,225,.34);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);animation:drop .5s both}
.notif:nth-child(2){animation-delay:.12s}.notif:nth-child(3){animation-delay:.24s}
@keyframes drop{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
.notif .t{flex:1;min-width:0;font-size:15px;line-height:1.3}
.notif .t b{font-weight:700}.notif .t small{opacity:.8;font-size:13px}
.nbtns{display:flex;gap:8px;margin-top:9px}
.nbtns button{background:rgba(255,255,255,.9);color:var(--ink);text-shadow:none;border-radius:99px;padding:7px 14px;font-size:14px;font-weight:700}
.swipe{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:16px;font-weight:600;padding:16px 40px 4px}
.swipe i{display:block;width:140px;height:5px;border-radius:9px;background:#fff}
.lock-hint{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:none}50%{transform:translateY(-5px)}}

/* Logo */
.logo{flex:none;width:44px;height:44px;border-radius:12px;background:var(--red-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#7a1530;text-shadow:none;line-height:.8;overflow:hidden}
.logo b{font-family:var(--f-serif);font-size:16px;font-weight:400;letter-spacing:.02em}
.logo em{font-family:var(--f-hand);font-size:12px;font-style:normal;margin-top:1px}

/* Accueil */
#home{z-index:5;overflow-y:auto;overflow-x:hidden;padding:calc(env(safe-area-inset-top,0px) + 30px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 128px) max(16px,env(safe-area-inset-left,0px))}
.hhead{position:relative;text-align:center;padding:4px 48px 16px}
.hello{font-family:var(--f-serif);font-size:48px;line-height:1;font-weight:400;margin:0;text-wrap:balance}
.hdate{font-size:16px;opacity:.92;margin-top:6px;font-weight:500}
.gear{position:absolute;right:0;top:4px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.3);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:grid;place-items:center;font-size:20px}
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.w{border-radius:26px;padding:15px;text-align:left;display:flex;flex-direction:column;min-height:170px;box-shadow:0 6px 20px rgba(0,0,0,.12);min-width:0;color:var(--ink);text-shadow:none;background:#fff}
.w.ex{background:var(--pink)}
.w.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:12px;background:rgba(255,255,255,.92)}
.w h3{margin:10px 0 2px;font-size:19px;font-weight:800;line-height:1.15}
.w p{margin:0;font-size:13.5px;line-height:1.35;opacity:.8}
.w .open{margin-top:auto;align-self:flex-start;background:#fff;color:var(--red);border-radius:99px;padding:7px 14px;font-weight:800;font-size:14px}
.w .big{font-size:44px;font-weight:800;color:var(--red);line-height:1;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.w .today{margin-top:auto;background:var(--red-soft);border-radius:14px;padding:8px 10px;font-size:13px;font-weight:700;line-height:1.3}

.edhead .who img{width:48px;height:48px;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.step{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border-radius:22px;padding:14px;border:1px solid var(--line)}
.step .num{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px}
.step.done .num{background:var(--good)!important;color:#fff;font-size:18px;font-weight:800}
.step .tx{flex:1;min-width:0}.step .tx b{display:block;font-weight:800;font-size:16px}
.step .tx span{color:var(--soft);font-size:13.5px}
.storycard{background:#fff;border-radius:24px;border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px}
.storycard .sn{display:flex;justify-content:space-between;align-items:center;gap:8px}
.storycard .st{font-size:17px;line-height:1.5;white-space:pre-wrap}
.storycard .fmt{font-size:13.5px;color:var(--soft);background:var(--paper);border-radius:12px;padding:8px 10px}
.storygrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stype{background:#fff;border:1.5px solid var(--line);border-radius:24px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px}
.stype .e{font-size:32px}.stype b{font-size:17px}.stype span{color:var(--soft);font-size:14px;line-height:1.35}
.stype em{font-style:normal;color:var(--red);font-weight:800;font-size:13.5px;margin-top:auto}
.money{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.money div{background:#fff;border-radius:20px;padding:14px 16px;border:1px solid var(--line);min-width:0}
.money span{color:var(--soft);font-size:13.5px;font-weight:700}
.money b{display:block;font-size:28px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.seg{display:flex;background:#ece4e5;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border-radius:11px;padding:10px 4px;font-weight:700;font-size:14.5px}
.seg button.sel{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.pin{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:30px}
.pin .dots{display:flex;gap:18px}.pin .dots i{width:16px;height:16px;border-radius:50%;border:2px solid #20a359}.pin .dots i.on{background:#20a359}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px}
.pad button{width:76px;height:76px;border-radius:50%;background:#fff;font-size:30px;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.pad button.clear{background:none;box-shadow:none;color:#20a359;font-size:22px}
.inst{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.inst:last-child{border-bottom:none}
.status{font-size:12.5px;font-weight:800;padding:3px 9px;border-radius:99px}
.status.paid{background:#e3f4ea;color:#1d7a45}.status.late{background:#fde6e9;color:var(--red)}.status.wait{background:#e7f0fd;color:#1c64c8}
.search{display:flex;align-items:center;gap:8px;background:#ebe5e6;border-radius:14px;padding:11px 14px;color:var(--soft)}
.search input{border:none;background:none;flex:1;min-width:0;font-size:17px;outline:none}
.lnk{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:14px 16px;border:1px solid var(--line)}
.lnk .tx{flex:1;min-width:0}.lnk b{font-size:16.5px}
.lnk .tx span{display:block;color:var(--soft);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-tag{font-size:12px;font-weight:800;color:#c08a00;background:#fdf1c8;border-radius:99px;padding:2px 8px;margin-left:6px}
.go{width:42px;height:42px;border-radius:50%;background:#f0ecec;color:#1e7cf2;font-weight:800;display:grid;place-items:center;flex:none;text-decoration:none}
.gold-btn{background:#e2a106;color:#fff;border-radius:99px;padding:10px 16px;font-weight:800;flex:none}
.sec-t{font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--soft);text-transform:uppercase;display:flex;justify-content:space-between;margin:6px 4px 0}
.capture{width:60%;aspect-ratio:9/14;max-width:100%;border-radius:20px;background:var(--red-soft);border:1.5px solid var(--line);display:grid;place-items:center;color:var(--soft);overflow:hidden}
.capture img{width:100%;height:100%;object-fit:cover}

/* Aura */
.aura{--p:0;position:relative;width:var(--sz,120px);height:var(--sz,120px);border-radius:50%;background:conic-gradient(from 200deg,#f6c7d5,#e7ddf7,#fbeec4,#c4ddd0,#f6c7d5);display:grid;place-items:center;flex:none}
.aura::before{content:"";position:absolute;inset:-10px;border-radius:50%;background:inherit;filter:blur(calc(var(--p)*0.18px));opacity:calc(.25 + var(--p)/140)}
.aura::after{content:"";position:absolute;inset:7px;border-radius:50%;background:conic-gradient(transparent calc(var(--p)*1%),rgba(255,255,255,.88) 0)}
.aura span{position:relative;z-index:1;width:72%;height:72%;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;line-height:1.05;box-shadow:inset 0 0 0 1px var(--line)}
.aura b{font-family:var(--f-serif);font-weight:400;font-size:calc(var(--sz,120px)*.28);color:var(--red)}
.aura small{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--soft)}
.brand{background:linear-gradient(160deg,#fff 0%,#fbf0f2 100%);border-radius:28px;padding:22px;border:1px solid var(--line);display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 30px rgba(122,21,48,.08)}
.brand .big{font-family:var(--f-serif);font-size:30px;line-height:1.1}
.brand .lbl{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.vente{display:flex;flex-direction:column;gap:0}
.vstep{display:flex;gap:14px;align-items:flex-start;position:relative;padding-bottom:16px}
.vstep:not(:last-child)::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line)}
.vstep .n{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-serif);font-size:24px;background:var(--red);color:#fff}
.vstep b{display:block;font-size:17px}.vstep p{margin:2px 0 0;color:var(--soft);line-height:1.45;font-size:15px}
.path{display:flex;flex-direction:column}
.pstep{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:10px 0;position:relative}
.pstep:not(:last-child)::after{content:"";position:absolute;left:31px;top:72px;height:calc(100% - 62px);width:3px;border-radius:3px;background:var(--line)}
.pstep.lit:not(:last-child)::after{background:linear-gradient(var(--gold),#f6c7d5)}
.pstep .orb{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-serif);font-size:28px;border:3px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.08)}
.pstep.lit .orb{box-shadow:0 0 0 4px rgba(214,163,58,.25),0 0 24px rgba(246,199,213,.9)}
.pstep .tx{flex:1;min-width:0}.pstep b{display:block;font-family:var(--f-serif);font-weight:400;font-size:24px;line-height:1.1}.pstep span{color:var(--soft);font-size:14px}
.dayc{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px 16px}
.dayc.lock{opacity:.5}
.dayc .d{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-weight:800;background:var(--red-soft);color:var(--red);font-size:13px;text-align:center;line-height:1.1}
.dayc.ok .d{background:var(--good);color:#fff;font-size:22px}
.dayc .tx{flex:1;min-width:0}.dayc b{display:block;font-size:16px}.dayc span{color:var(--soft);font-size:14px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare .capture{width:100%}
.locked{opacity:.55}

/* ====== Style v5 : cocooning + premium ====== */
.hand{font-size:24px;transform:none}
.h1{font-weight:500;font-size:46px;letter-spacing:0}
.h2{font-weight:500}.h3{font-weight:600}.part{font-weight:600;font-style:italic}
.hello{font-weight:500;font-style:italic;font-size:50px}
.logo b{font-family:var(--f-serif);font-weight:600;font-size:16px;font-style:italic}.logo em{font-size:11px}
/* En-tête des applis : bouton rond flottant, pas de barre iOS */
.nav{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(var(--paper) 60%,rgba(252,246,241,0));backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:none}
.back{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(122,21,48,.12);color:var(--red);justify-content:center;font-size:0;padding:0}
.back b{font-size:30px;line-height:1;margin-top:-3px}
.navtitle{font-family:var(--f-hand);font-weight:400;font-size:24px;color:var(--red)}
#appv{background:radial-gradient(120% 60% at 100% 0%,#f9e3e8 0%,rgba(249,227,232,0) 60%),var(--paper)}
/* Onglets en pilule flottante */
.tabbar{left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);border-radius:999px;background:rgba(255,255,255,.96);border:1px solid var(--line);box-shadow:0 10px 30px rgba(122,21,48,.14);padding:6px;gap:4px}
.tabbar button{flex-direction:row;justify-content:center;gap:5px;border-radius:999px;padding:10px 4px;font-size:13px}
.tabbar button span{font-size:16px;filter:none;opacity:1}
.tabbar button.sel{background:var(--blush);color:var(--red)}
.fab{bottom:calc(env(safe-area-inset-bottom,0px) + 86px)}
.has-tabs .abody{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 160px)}
.askq{bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
.has-tabs .askq{display:none}
/* Accueil : étagères de galets */
.shelf{font-family:var(--f-hand);font-size:26px;margin:22px 4px 8px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.35)}
.pebbles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pebble{position:relative;aspect-ratio:1/0.92;max-width:100%;border-radius:26px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;background:linear-gradient(155deg,rgba(255,255,255,.95) 0%,var(--pc,#fde3ea) 100%);box-shadow:0 6px 18px rgba(0,0,0,.12);min-width:0;transition:transform .15s}
.pebble:active{transform:scale(.95)}
.pebble .pe{font-size:28px;line-height:1}
.pebble .pl{font-weight:800;font-size:13px;line-height:1.15;color:var(--ink)}
.pebble img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.pebble .badge{position:absolute;top:8px;right:8px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:11.5px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.affcard{border-radius:30px;padding:20px 20px 16px;background:radial-gradient(120% 90% at 0% 0%,#fff 0%,#fbe7eb 55%,#f3d9c9 100%);box-shadow:0 10px 30px rgba(0,0,0,.14);display:flex;flex-direction:column;gap:10px;color:var(--ink);text-align:left}
.affcard .lbl{font-family:var(--f-hand);font-size:24px;color:var(--red);line-height:1}
.affcard .txt{font-family:var(--f-serif);font-style:italic;font-weight:500;font-size:28px;line-height:1.15;text-wrap:balance}
.affcard .acts{display:flex;gap:8px;flex-wrap:wrap}
.affcard .acts button{border-radius:99px;padding:8px 14px;font-weight:800;font-size:13.5px;background:rgba(255,255,255,.85);color:var(--red)}
.affcard .acts button.on{background:var(--red);color:#fff}
.minirow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{border-radius:24px;background:rgba(255,255,255,.93);padding:14px;text-align:left;display:flex;gap:10px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.1);min-width:0}
.mini b{display:block;font-size:14.5px}.mini span{font-size:12.5px;color:var(--soft)}
/* Rituel, objectifs */
.ritual{background:#fff;border-radius:26px;border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:10px}
.ritual .rt{font-family:var(--f-serif);font-style:italic;font-weight:600;font-size:24px}
.ritual input.input{border-radius:14px;min-height:46px}
.lineinp{display:flex;gap:10px;align-items:center}
.lineinp .k{flex:none;width:28px;height:28px;border-radius:50%;background:var(--blush);color:var(--red);display:grid;place-items:center;font-weight:800;font-size:13px}
.donebar{display:flex;align-items:center;gap:10px;background:#f1f8f3;border:1px solid #cfe7d8;color:#1d7a45;border-radius:18px;padding:12px 14px;font-weight:700}
.goal{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:none}
.goal .tt{flex:1;min-width:0;font-size:16px}
/* Ventes */
.stagechips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.stagechips::-webkit-scrollbar{display:none}
.pros{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:8px}
.pros .top{display:flex;gap:10px;align-items:center}
.pros .ini{flex:none;width:40px;height:40px;border-radius:50%;background:var(--blush);color:var(--red);display:grid;place-items:center;font-family:var(--f-serif);font-weight:600;font-size:20px}
.pros .tx{flex:1;min-width:0}.pros b{font-size:16px}.pros .tx span{display:block;color:var(--soft);font-size:13px}
.stagebar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.stagebar i{height:6px;border-radius:9px;background:#f1e3e6}.stagebar i.on{background:var(--red)}
.counter{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.counter:last-child{border-bottom:none}
.counter .cv{display:flex;align-items:center;gap:10px}
.counter .cv button{width:38px;height:38px;border-radius:50%;background:var(--blush);color:var(--red);font-weight:800;font-size:20px}
.counter .cv b{min-width:30px;text-align:center;font-size:20px;font-variant-numeric:tabular-nums}
.note{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px 16px;text-align:left;width:100%;display:flex;flex-direction:column;gap:4px}
.note b{font-size:16px}.note span{color:var(--soft);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.resitem{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;text-decoration:none;color:inherit}
.resitem .tx{flex:1;min-width:0}.resitem b{display:block}.resitem span{color:var(--soft);font-size:13.5px}
.coachnote{background:linear-gradient(160deg,#fff,#fbeef0);border:1px solid #f0d3da;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:6px}
.stbar{display:flex;gap:4px;margin-top:8px}
.stbar button{flex:1;border-radius:99px;padding:7px 2px;font-size:12px;font-weight:800;background:#f6eeef;color:var(--soft)}
.stbar button.on{background:var(--red);color:#fff}

/* Écran d'ouverture Aura */
#lock{justify-content:flex-start;gap:16px;padding-top:calc(env(safe-area-inset-top,0px) + 46px);text-align:center}
#lock .ovl{position:absolute;inset:0;z-index:-1;background:radial-gradient(70% 45% at 50% 32%,rgba(255,232,238,.55),rgba(255,255,255,0) 70%)}
.odate{font-size:16px;font-weight:700;letter-spacing:.02em}
.oaura{animation:breathe 4.5s ease-in-out infinite;margin-top:6px}
.oaura .aura{box-shadow:0 0 60px rgba(255,214,226,.9)}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.ohello{font-family:var(--f-serif);font-style:italic;font-weight:500;font-size:44px;line-height:1}
.oaff{width:100%;max-width:360px;border-radius:28px;padding:18px 20px;background:rgba(255,248,250,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);display:flex;flex-direction:column;gap:6px;color:var(--ink);box-shadow:0 10px 30px rgba(0,0,0,.15)}
.oaff .lbl{font-family:var(--f-hand);font-size:22px;color:var(--red)}
.oaff .txt{font-family:var(--f-serif);font-style:italic;font-weight:500;font-size:25px;line-height:1.2;text-wrap:balance}
.ochip{display:flex;align-items:center;gap:8px;max-width:360px;border-radius:99px;padding:6px 16px 6px 6px;background:rgba(255,255,255,.3);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff;font-weight:700;font-size:14px;text-align:left;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.ochip span{padding:4px 0}
.ochip:not(:has(img)){padding-left:16px}
.oenter{margin-top:auto;border-radius:99px;padding:16px 30px;background:#fff;color:var(--red);font-weight:800;font-size:17px;box-shadow:0 10px 30px rgba(0,0,0,.2)}

/* Accueil v6 : vrai téléphone */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.widget{border-radius:24px;background:rgba(255,255,255,.88);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);box-shadow:0 8px 24px rgba(0,0,0,.14);color:var(--ink);text-shadow:none;min-width:0}
.wwide{grid-column:1/-1;padding:16px 18px;display:flex;flex-direction:column;gap:6px;background:radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.96) 0%,rgba(251,231,235,.94) 60%,rgba(243,217,201,.94) 100%)}
.affw .lbl{font-family:var(--f-hand);font-size:21px;color:var(--red);line-height:1}
.affw .txt{font-family:var(--f-serif);font-style:italic;font-weight:500;font-size:23px;line-height:1.15;text-wrap:balance}
.affw .acts{display:flex;gap:8px}
.affw .acts button{border-radius:99px;padding:7px 13px;font-weight:800;font-size:13px;background:rgba(255,255,255,.9);color:var(--red)}
.affw .acts button.on{background:var(--red);color:#fff}
.wsq{aspect-ratio:1;max-width:100%;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.wsq .wl{font-weight:800;font-size:14px}.wsq .ws{font-size:12px;color:var(--soft);line-height:1.3}.wsq .wbig{font-size:40px;line-height:1}
.apps{margin-top:22px;grid-template-columns:repeat(4,1fr);gap:20px 8px}
.tile{width:62px;height:62px;border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 12px rgba(0,0,0,.18)}
.tile .emo-i{font-size:31px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
.tile img{border-radius:16px}
.folder-tile{background:rgba(255,255,255,.4);gap:4px;padding:8px;grid-template-columns:repeat(3,1fr);align-content:start}
.folder-tile i{border-radius:4px;aspect-ratio:1;max-width:100%;display:grid;place-items:center;font-size:8px;font-style:normal;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.ic .lbl{font-size:12px;font-weight:600}
#home{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 130px)}

.tile.locked{filter:saturate(.35) brightness(.98)}
.tile.locked .emo-i{opacity:.55}
.lockb{position:absolute;bottom:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.2);filter:none}

/* Barre d'état comme un vrai téléphone */
.sbar{display:none;position:absolute;z-index:58;left:0;right:0;top:0;pointer-events:none;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) max(28px,env(safe-area-inset-right,0px)) 6px max(30px,env(safe-area-inset-left,0px));font-family:-apple-system,"SF Pro Text",var(--f-ui);font-weight:600;font-size:16px;letter-spacing:-.01em;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);font-variant-numeric:tabular-nums;transition:color .2s}
.has-sb .sbar{display:flex}
.sb-dark .sbar{color:var(--ink);text-shadow:none}
.sbi{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.sig{display:flex;align-items:flex-end;gap:2px;height:11px}
.sig i{width:3px;border-radius:1px;background:currentColor}

/* ====== Synchronisation avec le Google Sheet de Cédryna ======
   Tant que CONFIG.api est vide, rien ne part : tout reste sur le téléphone. */
let syncT = null, syncing = false;
function scheduleSync(){ if(!CONFIG.api || !S.prenom) return; clearTimeout(syncT); syncT = setTimeout(sync, 4000); }
function post(body){ return fetch(CONFIG.api, {method:"POST", body:JSON.stringify(body)}).then(r=>r.json()); }
function syncData(){ const o = Object.assign({}, S); delete o.photo; delete o.avant; delete o.apres; return o; }
async function sync(){
  if(!CONFIG.api || !S.prenom || syncing) return; syncing = true;
  try{
    const wk0 = (S.week||{})[iso(monday())]||{};
    const r = await post({action:"sync", id:S.cid, prenom:S.prenom, insta:S.insta, metier:S.metier, debut:S.start,
      semaine:progW(), aura:auraPct()+" %", exercices:ALLSTEPS.filter(s=>S.done[s.id]).length+"/"+ALLSTEPS.length,
      posts:[0,1,2,3,4,5].filter(i=>(wk0[i]||{}).ok).length+"/6", scripts:S.scripts.filter(x=>x.status==="envoye").length,
      prospectes:(S.prospects||[]).filter(p=>p.st<4&&!p.lost).length, clientes:(S.prospects||[]).filter(p=>p.st===4).length,
      ca:(S.prospects||[]).filter(p=>p.st===4).reduce((a,p)=>a+(+p.montant||0),0), data:syncData()});
    if(r && r.ok){ if(typeof r.strategy==="string") S.coachStrat=r.strategy; if(typeof r.unlock==="boolean") S.unlockAll=r.unlock; if(Array.isArray(r.resources)) S.coachRes=r.resources; if(Array.isArray(r.messages)) gotMessages(r.messages); else try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
    for(const k of ["avant","apres"]) if(S[k] && !S.photoSync[k]){ const p = await post({action:"photo", id:S.cid, kind:k, data:S[k]}); if(p && p.ok){ S.photoSync[k]=true; localStorage.setItem(KEY, JSON.stringify(S)); } }
  }catch(e){ /* hors ligne : on réessaiera plus tard */ }
  syncing = false;
}
function gotMessages(ms){
  const before = (S.msgs||[]).length; S.msgs = ms;
  ms.forEach(m=>{ if(m.script){ const x=S.scripts.find(s=>s.id===m.script); if(x && x.status!=="corrige") x.status="corrige"; } });
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  if(ms.length > before){ if(typeof renderLock==="function") renderLock(); if(typeof renderHome==="function" && $("#lock").classList.contains("gone") && $("#appv").hidden) renderHome(); toast("📩 Nouveau message de "+CONFIG.coach); }

function loadImage(file, max, q, cb){
  const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{
    const k=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement("canvas");
    c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    cb(c.toDataURL("image/jpeg",q)); }; img.src=r.result; }; r.readAsDataURL(file);
}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=$("#confetti"), dev=$("#dev"); cv.hidden=false; cv.width=dev.clientWidth; cv.height=dev.clientHeight;
  const ctx=cv.getContext("2d"), cols=["#7a1530","#f6c7d5","#c4ddd0","#cbd9ef","#f5d1b6","#d6a33a"];
  const P=Array.from({length:140},()=>({x:cv.width/2+(Math.random()-.5)*60,y:cv.height*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6}));
  let f=0; (function tick(){ ctx.clearRect(0,0,cv.width,cv.height); P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.35; p.a+=.2; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); }); if(++f<110) requestAnimationFrame(tick); else cv.hidden=true; })();
}

function unlock(silent){ $("#lock").classList.add("gone"); $("#lock").style.transform=""; if(!silent){ renderHome(); setTimeout(celebrateUnlocks, 500); } }
function relock(){ $("#appv").hidden=true; current=null; $("#dev").classList.remove("sb-dark"); renderLock(); const l=$("#lock"); l.classList.remove("gone"); l.style.transform=""; }
function bindSwipe(){
  const l = $("#lock"); let y0=null, dy=0;
  l.addEventListener("pointerdown", e=>{ if(e.target.closest("button:not(.swipe), .notif")) return; y0=e.clientY; dy=0; l.style.transition="none"; });
  l.addEventListener("pointermove", e=>{ if(y0===null) return; dy=Math.min(0,e.clientY-y0); l.style.transform=`translateY(${dy}px)`; l.style.opacity=String(1+dy/600); });
  const end=()=>{ if(y0===null) return; l.style.transition=""; l.style.opacity=""; if(dy<-70) unlock(); else l.style.transform=""; y0=null; };
  l.addEventListener("pointerup", end); l.addEventListener("pointercancel", end);
  l.addEventListener("wheel", e=>{ if(e.deltaY>20) unlock(); }, {passive:true});
}

  if(el.tagName==="LABEL" || (el.tagName==="INPUT" && el.type==="checkbox")) return;
  if(el.dataset.native){ openNative(el.dataset.native); return; }
  if(el.dataset.open){ e.preventDefault(); closeSheet(); openApp(el.dataset.open, el.dataset.id); $("#appv .scroller").scrollTop=0; return; }
  const f = ACT[el.dataset.act]; if(f) f(el);
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ if(!$("#sheet").hidden && S.prenom && !$("#sheet").classList.contains("full")) closeSheet(); else if(!$("#folder").hidden) $("#folder").hidden=true; else if(!$("#appv").hidden) closeApp(); }
  if(e.key==="Enter" && e.target.id==="h-new") ACT.hAdd();
  if(e.key==="Enter" && e.target.id==="quick-t") ACT.quickAdd();
});
document.addEventListener("input", e=>{
  const b = e.target, a = b.dataset.act; if(!a) return;
  if(a==="ans"){ S.ans[current.id]=S.ans[current.id]||{}; S.ans[current.id][b.dataset.k]=b.value; save(); }
  if(a==="wans"){ S.ans.start=S.ans.start||{}; S.ans.start[b.dataset.k]=b.value; save(); }
  if(a==="set"){ S[b.dataset.k]= b.dataset.k==="insta" ? b.value.replace("@","") : b.value; save(); }
  if(a==="sans"){ S.sAns[current.sub]=S.sAns[current.sub]||{}; S.sAns[current.sub][b.dataset.k]=b.value; save(); }
  if(a==="info"){ S.infos[b.dataset.k]=b.value; save(); }
  if(a==="ident"){ S.ans.a1=S.ans.a1||{}; S.ans.a1[b.dataset.k]=b.value; save(); }
  if(a==="wdT"){ const w=wk(); w[b.dataset.i]=Object.assign({},w[b.dataset.i],{t:b.value}); save(); }
  if(a==="rit"){ const R=S.rituel[today()]=S.rituel[today()]||{}; R[b.dataset.k]=R[b.dataset.k]||[]; R[b.dataset.k][+b.dataset.i]=b.value; save(); }
  if(a==="ritT"){ const R=S.rituel[today()]=S.rituel[today()]||{}; R[b.dataset.k]=b.value; save(); }
  if(a==="strat"){ S.strat[b.dataset.k]=b.value; save(); }
  if(a==="numT"){ const k=numWeek||iso(monday()); S.nums[k]=S.nums[k]||{}; S.nums[k][b.dataset.k]=b.value; save(); }
  if(a==="noteT"||a==="noteB"){ const n=S.notes.find(x=>x.id===current.sub); n[a==="noteT"?"t":"b"]=b.value; n.d=new Date().toISOString(); save(); }
  if(a==="noteQ"){ noteQ=b.value; const pos=b.selectionStart; refresh(); const x=$("#nt-q"); x.focus(); x.setSelectionRange(pos,pos); }
  if(a==="prioT"){ S.prio[today()]=Object.assign({},S.prio[today()],{t:b.value}); save(); }
  if(a==="scTitle"||a==="scPart"){ const x=S.scripts.find(s=>s.id===current.sub); if(a==="scTitle") x.title=b.value; else x.parts[b.dataset.k]=b.value; save(); }
  if(a==="fcAns"){ S.ans.a3=S.ans.a3||{}; S.ans.a3[b.dataset.k]=b.value; save(); }
  if(a==="tmAns"){ S.temoins[b.dataset.k]=Object.assign({},S.temoins[b.dataset.k],{t:b.value}); save(); }
});
document.addEventListener("change", e=>{
  const b = e.target, file = b.files && b.files[0];
  if(file && b.id==="s-photo") loadImage(file, 1100, .75, u=>{ S.photo=u; S.wall=""; save(); applyLook(); renderLock(); refresh(); toast("Fond d'écran enregistré 📷"); });
  if(file && b.id==="s-apres") loadImage(file, 700, .7, u=>{ S.apres=u; S.photoSync.apres=false; save(); refresh(); confetti(); toast("Ton « après » est enregistré ✨"); });
  if(file && (b.id==="s-avant"||b.id==="w-avant")) loadImage(file, 700, .7, u=>{ S.avant=u; S.photoSync.avant=false; save(); if(b.id==="w-avant") $("#w-cap").innerHTML=`<img src="${u}" alt="">`; else refresh(); toast("Ta photo de départ est enregistrée 📸"); });
  if(b.dataset.act==="chk"){ S.chk[current.id]=S.chk[current.id]||{}; S.chk[current.id][b.dataset.k]=b.checked; save(); }
  if(b.dataset.act==="done"){ S.done[current.id]=b.checked; save(); if(b.checked){ confetti(); toast("Bravo, étape validée ✨"); } }
});

/* ====== Démarrage ====== */
/* Barre d'état : affichée dans le navigateur, cachée quand l'appli est installée (le téléphone affiche déjà la sienne) */
const installed = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
if(!installed) $("#dev").classList.add("has-sb");
function tickSb(){ const t=$("#sb-time"); if(t) t.textContent = clock(); }
tickSb(); setInterval(tickSb, 15000);
applyLook(); renderLock(); renderHome(); bindSwipe();
if(!S.prenom) showWelcome();
setTimeout(sync, 1500);
setInterval(()=>{ if(document.visibilityState==="visible") sync(); }, 180000);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") sync(); });
setInterval(()=>{ const c=document.querySelector(".lclock"); if(c && !$("#lock").classList.contains("gone")) c.textContent=clock(); const h=document.querySelector(".hero .hc"); if(h) h.textContent=clock(); }, 20000);

</script>
