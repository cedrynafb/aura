<title>Espace coach Aura</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700;800&family=Parisienne&display=swap">
<style>
/* Layout : tableau de bord coach. Liste des clientes à gauche (ou en haut sur téléphone), fiche complète à droite. */
:root{
  --paper:#fbf4ee; --card:#fff; --ink:#2b1418; --soft:#7d6268; --line:#f0dede;
  --red:#7a1530; --red-soft:#f7e4e7; --good:#2f8a55; --warn:#c77700;
  --pink:#f6c7d5; --mint:#c4ddd0; --sky:#cbd9ef; --peach:#f5d1b6; --butter:#fbeec4; --lilac:#e7ddf7;
  --f-serif:"Cormorant Garamond","Didot","Times New Roman",serif; --f-ui:"Manrope",-apple-system,"Segoe UI",Roboto,sans-serif; --f-hand:"Parisienne",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);margin:0;font-size:15px;line-height:1.45}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;margin-bottom:18px}
.hand{font-family:var(--f-hand);color:var(--red);font-size:22px}
h1{font-family:var(--f-serif);font-weight:400;font-size:44px;line-height:1;margin:0}
h1 em,h2 em{font-style:normal;color:var(--red)}
h2{font-family:var(--f-serif);font-weight:400;font-size:30px;line-height:1.05;margin:0}
h3{font-family:var(--f-serif);font-weight:400;font-size:24px;margin:0}
.muted{color:var(--soft);font-size:14px;margin:0}
.btn{border-radius:99px;padding:11px 18px;font-weight:800;background:#fff;border:1.5px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.btn.red{background:var(--red);color:#fff;border-color:transparent}
.btn.sm{padding:7px 12px;font-size:13.5px}
.demo{background:#fdf5d9;border:1.5px solid #f4e3a3;border-radius:16px;padding:12px 16px;margin-bottom:16px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;min-width:0}
.kpi span{color:var(--soft);font-size:13px;font-weight:700}.kpi b{display:block;font-size:30px;font-variant-numeric:tabular-nums}
.layout{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
.list{display:flex;flex-direction:column;gap:10px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding-bottom:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.chip{border-radius:99px;padding:7px 12px;font-weight:700;font-size:13.5px;background:#fff;border:1.5px solid var(--line)}
.chip.sel{background:var(--red);color:#fff;border-color:transparent}
.cl{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;width:100%}
.cl.sel{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.av{flex:none;width:46px;height:46px;border-radius:50%;background:var(--pink);display:grid;place-items:center;font-family:var(--f-serif);font-size:22px;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.cl .tx{flex:1;min-width:0}.cl b{display:block;font-size:16px}.cl .sub{color:var(--soft);font-size:13px}
.flags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.flag{font-size:11.5px;font-weight:800;border-radius:99px;padding:2px 8px}
.flag.warn{background:#fdecd2;color:var(--warn)}.flag.red{background:var(--red-soft);color:var(--red)}.flag.ok{background:#e3f4ea;color:#1d7a45}
.ring{--p:0;flex:none;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--red) calc(var(--p)*1%),var(--red-soft) 0);display:grid;place-items:center;position:relative;font-size:11.5px;font-weight:800}
.ring::before{content:"";position:absolute;inset:5px;border-radius:50%;background:#fff}.ring span{position:relative}
.detail{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;min-width:0}
.head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.head .av{width:72px;height:72px;font-size:32px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.stats div{background:var(--paper);border-radius:14px;padding:10px 12px;min-width:0}.stats span{font-size:12.5px;color:var(--soft);font-weight:700}.stats b{display:block;font-size:20px}
details.sec{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden}
details.sec summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary .n{margin-left:auto;color:var(--soft);font-weight:700;font-size:13.5px}
details.sec summary::after{content:"›";color:#c9b4b9;font-size:22px;transition:transform .2s}
details.sec[open] summary::after{transform:rotate(90deg)}
.secb{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px}
.qa{border-top:1px solid var(--line);padding-top:10px}
.qa .q{font-size:13px;font-weight:800;color:var(--soft)}
.qa .a{white-space:pre-wrap;font-size:15.5px;margin-top:2px}
.qa .a.empty{color:#c4b3b7;font-style:italic}
.step{border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}
.step summary{cursor:pointer;font-weight:800;display:flex;gap:8px;align-items:center}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--red-soft);color:var(--red)}
.pill.ok{background:#e3f4ea;color:#1d7a45}.pill.wait{background:#fdecd2;color:var(--warn)}.pill.grey{background:#f1ecec;color:var(--soft)}
.msg{display:flex;flex-direction:column;gap:8px}
.bubble{background:var(--red-soft);border-radius:16px;padding:10px 14px;white-space:pre-wrap}
.rin{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;min-width:0}
textarea{width:100%;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;min-height:90px;resize:vertical;font-size:15.5px;background:#fff}
textarea:focus,input:focus{outline:none;border-color:var(--pink);box-shadow:0 0 0 3px var(--red-soft)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare figure{margin:0}.compare img{width:100%;border-radius:14px;border:1px solid var(--line)}
.compare .empty{aspect-ratio:3/4;max-width:100%;border-radius:14px;background:var(--paper);display:grid;place-items:center;color:var(--soft);font-size:13px}
.weekg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.weekg div{border-radius:12px;padding:8px 6px;background:var(--paper);font-size:12.5px;min-width:0;overflow-wrap:anywhere}
.weekg div.ok{background:#e3f4ea}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
.login{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:14px;text-align:center}
.login input{border:1.5px solid var(--line);border-radius:16px;padding:14px;font-size:22px;text-align:center;letter-spacing:.2em;background:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;z-index:9}
.backbtn{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}.list{position:static;max-height:none}
  .kpis{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}
  .layout.has-sel .list{display:none}.layout:not(.has-sel) .detail{display:none}.backbtn{display:inline-flex}
}

document.addEventListener("click", async e=>{

    if(demo){ const it={id:Math.random().toString(36).slice(2,8),titre,lien,desc}; if(k==="c"){ const c=CL.find(x=>x.id===sel); const L=JSON.parse(c.ressources||"[]"); L.push(it); c.ressources=JSON.stringify(L); } else GRES.push(it); render(); toast("Ajoutée (démo) ✓"); return; }

  if(a==="copyTem"){ const c=CL.find(x=>x.id===sel), t=D(c).temoins||{}; const txt=TEMOINS.filter(x=>(t[x[0]]||{}).t).map(x=>x[1]+" : "+t[x[0]].t).join("\n\n"); try{ await navigator.clipboard.writeText(txt); toast("Témoignages copiés ✓"); }catch(_){ toast("Copie impossible ici"); } }
  if(a==="send"||a==="corr"){
    const c = CL.find(x=>x.id===sel), ta = a==="send" ? $("#m-txt") : $("#corr-"+CSS.escape(b.dataset.v)), text = ta.value.trim();
    if(!text){ toast("Écris ton message d'abord"); return; }
    const m = {id:Math.random().toString(36).slice(2,8), t:text, d:new Date().toISOString(), script: a==="corr"?b.dataset.v:""};
    if(demo){ const ms=msgs(c); ms.push(m); c.messages=JSON.stringify(ms); if(a==="corr"){ const x=(D(c).scripts||[]).find(s=>s.id===b.dataset.v); if(x) x.status="corrige"; c.scripts_a_corriger=Math.max(0,c.scripts_a_corriger-1); } render(); toast("Envoyé (démo) ✓"); return; }
    b.disabled = true;
    try{ const r = await post({action:"message", id:c.id, text, script:m.script}); if(r.ok){ toast("Envoyé ✓ Elle le verra à sa prochaine ouverture"); const ms=msgs(c); ms.push(m); c.messages=JSON.stringify(ms); render(); } else toast("L'envoi n'a pas marché, réessaie"); }
    catch(_){ toast("Pas de connexion, réessaie"); b.disabled=false; }
  }
});
load();
